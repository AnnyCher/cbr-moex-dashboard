<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мониторинг · ЦБ РФ + MOEX</title>
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <span class="brand__mark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/>
            </svg>
          </span>
          <span class="brand__name">Мониторинг</span>
          <span class="brand__sep">/</span>
          <span class="brand__sub">ЦБ РФ · MOEX</span>
        </div>
        <div class="topbar__actions">
          <span class="updated" id="updated-at">
            <span class="updated__dot"></span>
            <span>Загрузка…</span>
          </span>
          <button class="btn-icon" id="btn-theme" title="Сменить тему (T)" aria-label="Сменить тему">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
          </button>
          <button class="btn-refresh" id="btn-refresh" title="Обновить (R)">
            <svg class="btn-refresh__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
            </svg>
            <span>Обновить</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="status" id="status"></div>
      <div class="dashboard-toolbar"></div>
      <section class="grid"></section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <span>Источники: ЦБ РФ · Московская Биржа (ISS MOEX)</span>
        <span>
          <a href="https://cbr.ru" target="_blank" rel="noopener">cbr.ru</a> ·
          <a href="https://iss.moex.com" target="_blank" rel="noopener">iss.moex.com</a>
        </span>
      </div>
    </footer>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
